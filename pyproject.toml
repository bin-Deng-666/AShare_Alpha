[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-alpha"
version = "0.1.0"
description = "Audited A-share data, strategy research, daily backtesting and next-session plans"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{name = "AShare Alpha contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "pyarrow>=14,<24", "duckdb>=1.0,<2",
]

[project.optional-dependencies]
data = [
  "akshare>=1.18.63,<1.19", "baostock>=0.9.3,<1", "requests>=2.31,<3",
  "mini-racer>=0.12.4,<1; platform_system != 'Linux'",
]
web = ["fastapi>=0.115,<1", "uvicorn>=0.24,<1", "pyyaml>=6,<7"]
dev = ["ashare-alpha[web,data]", "pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.14,<1", "build>=1.2,<2"]

[project.scripts]
ashare-alpha = "ashare_alpha.__main__:main"
ashare-data = "ashare_alpha.data.__main__:main"
ashare-plan = "ashare_alpha.cli.run:main"
ashare-web = "ashare_alpha.web.server:main"

[project.urls]
Repository = "https://github.com/bin-Deng-666/AShare_Alpha"
Issues = "https://github.com/bin-Deng-666/AShare_Alpha/issues"

[tool.setuptools]
package-dir = {ashare_alpha = "src", strategy = "strategy"}
packages = [
  "ashare_alpha", "ashare_alpha.backtest", "ashare_alpha.cli",
  "ashare_alpha.cli.utils", "ashare_alpha.cli.utils.adapters",
  "ashare_alpha.data", "ashare_alpha.data.assets", "ashare_alpha.data.pipeline",
  "ashare_alpha.data.research", "ashare_alpha.data.rules", "ashare_alpha.data.sources",
  "ashare_alpha.research", "ashare_alpha.web", "ashare_alpha.web.api",
  "ashare_alpha.web.core", "ashare_alpha.web.strategies", "ashare_alpha.web.strategies.demo",
  "strategy", "strategy.demo",
]

[tool.setuptools.package-data]
"ashare_alpha.data" = ["config/*.json"]
"strategy.demo" = ["presets/*.json"]
"ashare_alpha.web" = ["static/*.html", "static/*.css", "static/*.js", "strategies/demo/strategy.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "workspace/cache/pytest"
addopts = "-ra"

[tool.ruff]
target-version = "py310"
cache-dir = "workspace/cache/ruff"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "strategy/demo/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
