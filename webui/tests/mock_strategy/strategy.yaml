# mock_alpha strategy declaration — for acceptance testing only.
# Deliberately uses DIFFERENT column names, field names, and labels
# vs the public demo to prove config-driven rendering.

strategy_id: mock_alpha
display_name: Mock Alpha (测试)
version: mock_v1.0

# ── Path layout (all point to fixtures/ — no real data) ──
repo_root: webui/tests/mock_strategy/fixtures
panel_path: mock_panel.parquet
panel_hash_expected: "deadbeef"
catalog_path: webui/tests/mock_strategy/fixtures/mock_catalog.duckdb
t_full_source: webui/tests/mock_strategy/fixtures/daily_update.json
calendar_source: webui/tests/mock_strategy/fixtures/mock_calendar.parquet
ledger_source: trades.csv
output_dir: webui/tests/mock_strategy/fixtures/output
golden_meta_path: golden_meta.json
factor_health_dir: reports

# ── Daily plan generation (echo — fixture data already exists) ──
daily_plan_command:
  - echo
  - "Mock daily plan generated (fixture data)"
daily_plan_cwd: .
daily_plan_timeout: 10

# ── Auxiliary data sources (different from the public demo) ──
aux_sources:
  - id: mock_bars
    display_name: 模拟行情
    table: mock_stock_daily
    date_column: date
  - id: mock_flow
    display_name: 模拟资金流
    table: mock_flow_daily
    date_column: date

# ── Market status fields (different keys/labels) ──
market_status_fields:
  - key: mkt_regime
    label: 大盘状态
  - key: universe_n
    label: 宇宙
  - key: open_long_n
    label: open_long
  - key: reduce_n
    label: reduce
  - key: avoid_n
    label: avoid

# ── Plan table columns (different from the public demo) ──
plan_columns:
  buy:
    - { key: code, label: 代码 }
    - { key: name, label: 名称 }
    - { key: action, label: action }
    - { key: signal_score, label: 信号分 }
    - { key: sector, label: 行业 }
    - { key: momentum, label: 动量 }
    - { key: volatility_regime, label: 波动 }
    - { key: liquidity_tier, label: 流动性 }
    - { key: pct_change, label: 涨跌% }
    - { key: reason, label: 理由 }
  sell:
    - { key: code, label: 代码 }
    - { key: name, label: 名称 }
    - { key: action, label: action }
    - { key: sector, label: 行业 }
    - { key: momentum, label: 动量 }
    - { key: volatility_regime, label: 波动 }
    - { key: liquidity_tier, label: 流动性 }
    - { key: pct_change, label: 涨跌% }
    - { key: reason, label: 理由 }

# ── Positions table columns (different from the public demo) ──
positions_columns:
  - { key: code, label: 代码 }
  - { key: name, label: 名称 }
  - { key: avg_cost, label: 成本 }
  - { key: pnl_pct, label: 浮盈% }
  - { key: hold_days, label: 持有天数 }

# ── Sell reason enumeration ──
sell_reasons:
  - reduce
  - avoid

# ── Positions calculation ──
take_profit: 0.20
stop_loss: 0.10

# ── Update pipeline (echo — no real data update) ──
update_pipeline:
  - id: mock_fetch
    label: 模拟数据抓取
    source_desc: "模拟行情数据（{t_full+1} → {latest_trade_date}）"
    command:
      - echo
      - "Step 1/3 Mock data fetch: bars + indicators complete"
    cwd: .
    timeout: 10

# ── Post-update checks (echo — simulates golden PASS) ──
post_update_checks:
  - id: mock_golden
    label: 模拟Golden检查
    command:
      - echo
      - "=== GOLDEN PASS === TR=45.23% Sharpe=1.85"
    cwd: .
    timeout: 10
    updates_golden: true
